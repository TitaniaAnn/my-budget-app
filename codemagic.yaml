# Codemagic: build the iOS app and upload it to App Store Connect.
#
# Start it from codemagic.io -> my-budget-app -> "iOS -> TestFlight" -> Start new
# build. Modelled on My-Pottery-Studio's ios-beta lane: same signing path
# (fetch certs + profiles through the App Store Connect API, fresh keychain),
# and the repo's own CI checks run before anything is built.
#
# Encrypted variables, in a Codemagic variable group named `mybudgetapp`:
#   AUTH_KEY                                 App Store Connect API .p8 contents (fetches signing files)
#   CERTIFICATE_KEY                          Apple Distribution certificate's private key
#   APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY  the same .p8, for the upload step
#   APP_STORE_APPLE_ID                       the app's numeric Apple ID (App Store Connect -> App Information)
#   SUPABASE_URL                             production project URL, https://<ref>.supabase.co
#   SUPABASE_ANON_KEY                        its anon key (never the service_role key)
# The API key and certificate can be the same ones My-Pottery-Studio uses.
#
# iOS has a single Runner scheme, so unlike the Android release (which
# needs --flavor prod) the iOS build takes no --flavor.

workflows:
  ios-testflight:
    name: iOS -> TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: mobile
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - mybudgetapp
      vars:
        BUNDLE_ID: com.mybudgetapp.mobile
        # Same App Store Connect API key as My-Pottery-Studio's codemagic.yaml.
        APP_STORE_CONNECT_ISSUER_ID: 858e501a-6f84-4701-b42a-4c9ae03c0413
        APP_STORE_CONNECT_KEY_IDENTIFIER: 7RRD84J8L2
    scripts:
      # Fail in seconds, not after a 10-minute build, when a variable is missing.
      - name: Check configuration
        script: |
          set -e
          missing=""
          for v in AUTH_KEY CERTIFICATE_KEY APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY APP_STORE_APPLE_ID SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "$(printenv "$v")" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: missing Codemagic variables:$missing"
            echo "Add them to the 'mybudgetapp' variable group (see the top of codemagic.yaml)."
            exit 1
          fi
          # Same guard as scripts/build-release.sh: a localhost URL must never ship.
          case "$SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) ;; *) echo "ERROR: SUPABASE_URL must be the production https://<ref>.supabase.co URL, got: $SUPABASE_URL"; exit 1 ;; esac
          echo "Configuration OK"

      - name: Flutter packages
        script: flutter pub get

      # The same gate the repo's CI runs, so a build never ships untested code
      # even while GitHub Actions isn't running.
      - name: Analyze and test
        script: |
          set -e
          dart run build_runner build --delete-conflicting-outputs
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      # One more than every build Apple has on record (TestFlight, App Store,
      # processing, expired), so an upload never collides with "already used".
      - name: Pick build number
        script: |
          set -e
          BUILD_NUMBER=$(($(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID") + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "Build number $BUILD_NUMBER"

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --create \
            --type IOS_APP_STORE \
            --platform IOS \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key @env:AUTH_KEY \
            --certificate-key @env:CERTIFICATE_KEY
      - name: Keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Use profiles
        script: xcode-project use-profiles

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PUBLISHER_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        # Uploaded for internal testers; submit to beta review or the App
        # Store by hand in App Store Connect.
        submit_to_testflight: false
        submit_to_app_store: false

  # Android -> Google Play internal testing track.
  # One-time setup: upload the app's upload keystore in Codemagic (Team settings
  # -> Code signing identities -> Android keystores) as `mybudgetapp_upload`; put the Play
  # service account JSON in variable group `google_play` as
  # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS and the same SUPABASE_* values as iOS in group `mybudgetapp`.
  # Upload the first .aab by hand in Play Console; this lane does the rest.
  # Android needs --flavor prod (com.mybudgetapp.mobile); dev is a separate app id.
  android-play:
    name: Android -> Play internal
    max_build_duration: 60
    instance_type: linux_x2
    working_directory: mobile
    environment:
      flutter: stable
      # The upload keystore, added once in Codemagic: Team settings ->
      # Code signing identities -> Android keystores, with this reference
      # name. Codemagic exposes it as CM_KEYSTORE_PATH / CM_KEYSTORE_PASSWORD
      # / CM_KEY_ALIAS / CM_KEY_PASSWORD.
      android_signing:
        - mybudgetapp_upload
      groups:
        # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS: the Play Console service
        # account JSON, shared by every app.
        - google_play
        - mybudgetapp
      vars:
        PACKAGE_NAME: com.mybudgetapp.mobile
    scripts:
      # Fail in seconds, not after a 10-minute build, when a variable is missing.
      - name: Check configuration
        script: |
          set -e
          missing=""
          for v in GCLOUD_SERVICE_ACCOUNT_CREDENTIALS CM_KEYSTORE_PATH CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "$(printenv "$v")" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "ERROR: missing Codemagic variables:$missing"
            echo "See the comment above this workflow in codemagic.yaml."
            exit 1
          fi
          case "$SUPABASE_URL" in https://*.supabase.co|https://*.supabase.co/) ;; *) echo "ERROR: SUPABASE_URL must be the production https://<ref>.supabase.co URL, got: $SUPABASE_URL"; exit 1 ;; esac
          echo "Configuration OK"

      # android/app/build.gradle.kts signs releases from android/key.properties.
      - name: Write key.properties
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF

      - name: Flutter packages
        script: flutter pub get

      # The same gate the repo's CI runs, so a build never ships untested code
      # even while GitHub Actions isn't running.
      - name: Analyze and test
        script: |
          set -e
          dart run build_runner build --delete-conflicting-outputs
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      # One more than the highest version code Play has on any track. Play
      # can't be asked about an app that has never had a build uploaded:
      # upload the very first .aab by hand in Play Console.
      - name: Pick version code
        script: |
          set -e
          if ! LATEST=$(google-play get-latest-build-number \
                 --package-name "$PACKAGE_NAME" \
                 --credentials @env:GCLOUD_SERVICE_ACCOUNT_CREDENTIALS); then
            echo "ERROR: couldn't read the latest version code for $PACKAGE_NAME from Google Play."
            echo "Check that the service account has access to this app in Play Console,"
            echo "and that one .aab has already been uploaded there by hand."
            exit 1
          fi
          BUILD_NUMBER=$((LATEST + 1))
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$CM_ENV"
          echo "Version code $BUILD_NUMBER"

      - name: Build app bundle
        script: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --flavor prod \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

    artifacts:
      - mobile/build/app/outputs/bundle/prodRelease/*.aab
      - build/app/outputs/bundle/prodRelease/*.aab
      - mobile/build/app/outputs/mapping/**/mapping.txt

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # true while the app has never been through Play review (a "draft
        # app" only accepts draft releases); flip to false after its first
        # release is published.
        submit_as_draft: true
