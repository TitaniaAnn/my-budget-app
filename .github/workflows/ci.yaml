name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile  # your Flutter app lives here
    steps:
      - uses: actions/checkout@v4

      # Pinned: an unpinned `stable` picked up Flutter 3.47 (Dart 3.13) on
      # its own, and the analyzer behind build_runner at the time couldn't
      # read it, so code generation hung. Move this, codemagic.yaml and
      # pubspec.yaml's `flutter:` constraint together.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate freezed / riverpod / json_serializable files
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test