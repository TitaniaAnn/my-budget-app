name: mybudget
description: Family budget tracking app
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Audit 2026-05-26 I1: localization infrastructure. The
  # delegate generates lib/l10n/app_localizations.dart from
  # the .arb files via `flutter gen-l10n` (also fires on
  # `flutter run` when l10n.yaml is present). Even if no
  # locale beyond en_US ships in v1, threading
  # `AppLocalizations.of(context)` everywhere now keeps a
  # future translator from having to refactor 178 inline
  # `Text('...')` calls.
  flutter_localizations:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Audit 2026-05-26 M1: removed unused `flutter_secure_storage`
  # and `local_auth`. Neither was imported anywhere in lib/.
  # They were shipping ~2-3MB of native code per ABI + pulling
  # OS framework deps. If biometric unlock / secure-storage of
  # the Plaid access_token (audit M2 follow-up) gets prioritised,
  # re-add then. iOS NSFaceIDUsageDescription stays pre-declared
  # in Info.plist so re-wiring doesn't need another plist patch.

  # Camera & file picking
  image_picker: ^1.1.2
  file_picker: ^8.3.7

  # Charts
  fl_chart: ^0.70.2

  # Money math
  decimal: ^3.2.6

  # CSV parsing
  csv: ^6.0.0

  # On-device ML categorizer (consumes tools/categorizer/ outputs)
  onnxruntime: ^1.4.1

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  shared_preferences: ^2.3.5

  # UI
  cupertino_icons: ^1.0.8

  # PDF report generation (monthly_report screen).
  pdf: ^3.11.1
  printing: ^5.13.3

  # Local notifications (budget alerts, large-transaction warnings).
  # Fires from inside the running app — no FCM/APNS plumbing in v1.
  flutter_local_notifications: ^17.2.4

  # Disk-backed image cache for receipt thumbnails. Without it
  # `Image.network` re-downloads on every cold start — a 50-receipt
  # household pays N round-trips per dashboard open (audit P5).
  cached_network_image: ^3.4.1

  # Client-side JPEG/PNG compression so receipt uploads don't push
  # 1-2 MB of full-resolution camera output per row (audit P5).
  # Powers the 256-px thumbnail generation in the capture flow.
  flutter_image_compress: ^2.4.0
  plaid_flutter: ^5.1.1

  # Offline persistence (audit L1 Phase 1). SQLite via drift +
  # platform-bundled sqlite3 binary. path_provider locates the
  # per-app docs dir to put the database file in.
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # Online/offline status stream feeding the offline banner and
  # the cache-through repositories' fall-back decision.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  # Audit 2026-05-26 I1: generate AppLocalizations from
  # lib/l10n/*.arb on every `flutter run` / `flutter build`.
  # The companion l10n.yaml configures the template arb,
  # output class name, and output file location.
  generate: true
  assets:
    - assets/images/
    # ML category model — produced by tools/categorizer/train.py.
    # Empty until first training run; the classifier loads gracefully
    # when assets are missing and the keyword matcher takes over.
    - assets/ml/
